# The API only. The React client is hosted on Vercel, which forwards /api to this service (see vercel.json).
services:
  - type: web
    name: fuellog
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build -w server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0 # the Supabase client needs the WebSocket built into Node 22 and throws on Node 20
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: AI_DAILY_LIMIT
        value: "40"
