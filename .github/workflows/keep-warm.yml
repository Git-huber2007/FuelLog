name: Keep Warm

on:
  schedule:
    # Every 10 minutes between 00:30 and 17:30 UTC
    - cron: '30,40,50 0 * * *'
    - cron: '*/10 1-16 * * *'
    - cron: '0,10,20,30 17 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: curl -f -s -S --retry 2 https://fuellog-4uka.onrender.com/api/health
